# Promotes the current staging bundle to the live server.
# Backs up the previous live bundle for rollback capability.
name: Promote to Live

on:
  workflow_dispatch:

concurrency:
  group: "live"
  cancel-in-progress: false

jobs:
  promote:
    runs-on: self-hosted

    steps:
    - name: Back up current live bundles
      # Skipped on the very first promote, when there is no live bundle to back up yet.
      continue-on-error: true
      run: node dev/scripts/promoteBundles.js backup

    - name: Promote staging bundles to live
      run: node dev/scripts/promoteBundles.js promote

    - name: Restart live server
      run: pm2 startOrRestart ecosystem.config.js --only live

    - name: Verify deployment
      run: |
        sleep 5
        pm2 status live

    - name: Verify runtime Node.js version
      run: node dev/scripts/assertRuntimeNodeVersion.js live
