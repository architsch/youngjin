# Rolls back the live server to the previous bundle.
name: Rollback Live

on:
  workflow_dispatch:

concurrency:
  group: "live"
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: self-hosted
    # The app's own folder in the workspace the last staging deploy laid out.
    defaults:
      run:
        working-directory: robot-rooms

    steps:
    - name: Check backup exists
      run: test -f dist/server/bundle.backup.js

    - name: Restore backup bundles
      run: node dev/scripts/promoteBundles.js rollback

    - name: Restart live server
      # Registered anew rather than restarted, and saved (see deploy-staging.yml).
      run: |
        pm2 delete live 2>/dev/null || true
        pm2 start ecosystem.config.js --only live
        pm2 save

    - name: Verify rollback
      run: |
        sleep 5
        pm2 status live
