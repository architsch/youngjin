# Restarts the live server in place, on the bundle it is already running.
#
# This is not a deployment. Nothing is checked out, built or copied, so the process comes
# back on exactly the code it went down with — the only thing that changes is that its
# memory starts empty. Use "Promote to Live" to ship a new bundle, and "Rollback Live" to
# go back to the previous one.
#
# What it is for is the server's in-memory state, which outlives the database it was read
# from. Rooms are held as RoomRuntimeMemory once loaded, and hub rooms are never unloaded,
# so a room edited or removed directly in Firebase keeps being served from the copy the
# process took beforehand. Restarting is what makes it read the database again.
#
# It disconnects whoever is playing; they reconnect on their own, and Nginx serves the
# maintenance page for the few seconds the app is not listening.
name: Restart Live

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why the live server is being restarted (recorded in the run log)"
        required: false
        default: "Refresh cached in-memory state"

# Shares the "live" group with Promote and Rollback so a restart can never overlap one of
# them, either of which would be swapping the live bundle out from underneath it.
concurrency:
  group: "live"
  cancel-in-progress: false

jobs:
  restart:
    runs-on: self-hosted

    steps:
    - name: Report what is being served before the restart
      env:
        # Passed through the environment rather than interpolated into the script, so that
        # the contents of the input can never be run as shell.
        REASON: ${{ inputs.reason }}
      run: |
        echo "Reason: $REASON"
        echo -n "Build currently being served: "
        curl -fsS --max-time 10 http://127.0.0.1:3000/health || echo "(no answer — the app is already down)"

    - name: Restart the live app
      # `pm2 restart` deliberately, rather than the `pm2 startOrRestart ecosystem.config.js`
      # that the deploy workflows use: this workflow must not be able to change what runs.
      # A plain restart respawns the app from the same script, bundle and captured
      # environment, which is also why `--update-env` is left off.
      #
      # PM2 stops it with SIGINT, which the server handles rather than dying on: it turns
      # /health to 503, saves every dirty room and each connected user's player metadata,
      # and only then exits.
      run: pm2 restart live

    - name: Wait for the server to answer again
      # The health route reports 503 from the moment the shutdown signal arrives until the
      # replacement process is listening, so polling it until it returns 200 is a real
      # readiness signal rather than a guess at how long startup takes — which here means
      # reloading every hub room from Firestore, and grows with the number of them.
      run: |
        for attempt in $(seq 1 30); do
          if curl -fsS --max-time 5 http://127.0.0.1:3000/health; then
            echo ""
            echo "Live server is listening again (attempt $attempt)."
            exit 0
          fi
          sleep 2
        done
        echo "Live server did not come back within 60 seconds."
        pm2 logs live --lines 50 --nostream || true
        exit 1

    - name: Verify the app is online
      run: pm2 status live

    - name: Verify it is reachable from outside
      # The wait above talks to the app directly. This goes through Nginx and TLS, which is
      # the path a player actually arrives on.
      run: curl -fsS --max-time 10 -o /dev/null -w 'https://app.thingspool.net/health -> %{http_code}\n' https://app.thingspool.net/health

    - name: Verify runtime Node.js version
      # A restart is exactly when a PM2 daemon still holding an old interpreter would put the
      # app back onto it, so this is worth asserting here as much as after a deployment.
      run: node dev/scripts/assertRuntimeNodeVersion.js live
